---
- name: Perform OS updates to Linux hosts
  hosts: all
  become: true
  vars_files: ~/.ansible/inventory/vaulted_vars.yml
  tasks:
    - name: Update all packages on Debian-like hosts
      apt:
        name: '*'
        update_cache: true
        state: latest
      when: ansible_os_family == "Debian" or ansible_os_family == "Parrot OS"

    - name: Update all packages on RedHat-like hosts
      dnf:
        name: '*'
        update_cache: true
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Check Debian-like hosts for reboots
      stat:
        path: /var/run/reboot-required
      register: debian_reboot
      when: ansible_os_family == "Debian"

    - name: Check RedHat-like hosts for reboots
      shell: needs-restarting -r > /dev/null
      register: redhat_reboot
      ignore_errors: true
      when: ansible_os_family == "RedHat"
#     when running playbooks in check mode, command and shell modules will not
#     run. this breaks the reboot module below since the redhat_reboot variable will
#     have no value if the module above isn't run. "check_mode: false" ensures
#     the module will run in check mode
      check_mode: false

#    - name: Perform pending reboots on unimportant hosts
#      hosts: all:!important
#      become: true
#      vars_files: ~/.ansible/inventory/vaulted_vars.yml
#      tasks:
#        - name: Reboot hosts
#          reboot:
#          when: (ansible_facts['os_family'] == "RedHat" and redhat_reboot.rc == 1) or
#            (ansible_facts['os_family'] == "Debian" and
#            debian_reboot.stat.exists == true)

    - name: Print hosts that need reboots
      ansible.builtin.debug:
        msg: "System needs a reboot"
      when: (ansible_facts['os_family'] == "RedHat" and redhat_reboot.rc == 1) or
        (ansible_facts['os_family'] == "Debian" and
        debian_reboot.stat.exists == true)
