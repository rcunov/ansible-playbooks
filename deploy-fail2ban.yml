---
- name: Install and configure fail2ban for Debian and RHEL-based machines
  hosts: all
  become: true
  vars_files: ~/.ansible/inventory/vaulted_vars.yml
  tasks:
    - name: Stop if OS is not supported
      fail:  # os_family must be either RedHat or Debian
        msg: "System operating system is not supported"
      when: (ansible_facts['os_family'] != "Debian") and
            (ansible_facts['os_family'] != "RedHat")

    - name: Install fail2ban on Debian-based machines
      apt:
        name: 'fail2ban'
        update_cache: true
        state: latest
      when: ansible_os_family == "Debian"

    - name: Install fail2ban on RHEL-based machines
      dnf:
        name: 'fail2ban'
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Copy fail2ban config file
      copy:
        src: jail.local
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: '0644'

    - name: Ensure /var/run/fail2ban permissions on RHEL
      file:
        path: /var/run/fail2ban
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: Start and enable fail2ban service
      systemd:
        name: fail2ban
        state: started
        enabled: true

